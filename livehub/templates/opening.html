<!-- オープニング演出:1日1回、架空の会場の幕が開く。タップで飛ばせる。動きを減らす設定では出さない -->
<style>
#opening{position:fixed;inset:0;z-index:100;overflow:hidden;background:#000;cursor:pointer;opacity:1;transition:opacity .25s ease}
#opening.bye{opacity:0;pointer-events:none}
#opening .scene{position:absolute;inset:0;width:100%;height:100%}
#opening .cur{position:absolute;top:0;bottom:0;will-change:transform;transition:transform .6s cubic-bezier(.65,0,.35,1)}
#opening .cur-l{left:0;width:51%;transform-origin:0 0}
#opening .cur-r{right:0;width:51%;transform-origin:100% 0}
#opening .cur-1{left:0;right:0}
#opening .valance{position:absolute;left:0;right:0;top:0;height:9%;z-index:3;
  background:radial-gradient(ellipse 40px 26px at 40px 0,var(--cd) 98%,transparent) 0 100%/80px 30px repeat-x,linear-gradient(var(--cd),var(--cl));box-shadow:0 6px 18px rgba(0,0,0,.6)}
#opening .op-name{position:absolute;left:0;right:0;top:40%;z-index:4;text-align:center;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.8);transition:opacity .4s}
#opening .op-name small{display:block;font-size:12px;letter-spacing:.2em;opacity:.85}
#opening .op-name b{display:block;font-size:26px;margin:6px 16px;line-height:1.3}
#opening .op-name em{font-style:normal;font-size:11px;opacity:.7}
#opening .op-logo{position:absolute;left:0;right:0;top:44%;z-index:4;text-align:center;font:900 40px/1 system-ui,sans-serif;letter-spacing:.06em;color:#fff;opacity:0;transform:scale(.9);transition:opacity .5s .1s,transform .6s .1s;text-shadow:0 0 24px rgba(255,255,255,.35)}
#opening .op-logo b{color:#ff5a36}
#opening .op-skip{position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:5;background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 14px;font:inherit;font-size:12px}
#opening .fx{opacity:0;transition:opacity .6s .35s}
#opening.open .fx{opacity:1}
#opening.open .op-name{opacity:0}
#opening.open .op-logo{opacity:1;transform:none}
/* 幕の開き方 */
#opening.open.c-split .cur-l{transform:translateX(-102%)}
#opening.open.c-split .cur-r{transform:translateX(102%)}
#opening.open.c-swag .cur-l{transform:scaleX(.16) skewY(-8deg)}
#opening.open.c-swag .cur-r{transform:scaleX(.16) skewY(8deg)}
#opening.open.c-rise .cur-1{transform:translateY(-100%)}
#opening.open.c-pull .cur-1{transform:translateX(102%)}
#opening.c-fold .cur-1{transform-origin:50% 0}
#opening.open.c-fold .cur-1{transform:scaleY(0)}
#opening.open.c-drop .cur-1{transform:translateY(105%)}
#opening.c-drop .cur-1{transition-timing-function:cubic-bezier(.55,0,1,.45)}
/* きらめき(点滅ではなく、ゆっくり明るさが変わるだけ) */
#opening .pl{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
#opening .cast{opacity:.25;transition:opacity .5s .3s}
#opening.open .cast{opacity:1}
#opening.open .pop{animation:pop .4s .45s ease-out both;transform-box:fill-box;transform-origin:50% 100%}
#opening.open .pop2{animation:pop .4s .6s ease-out both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes pop{40%{transform:translateY(-6px)}}
#opening .tw{animation:tw 1.6s ease-in-out infinite alternate}
#opening .tw:nth-child(3n){animation-delay:.5s}
#opening .tw:nth-child(3n+1){animation-delay:1s}
@keyframes tw{from{opacity:.25}to{opacity:1}}
@media (prefers-reduced-motion: reduce){#opening{display:none}}
</style>
<div id="opening" hidden aria-hidden="true"></div>
<script>
(() => {
  const V = /*__OPENING__*/[];
  if (!V.length) return;
  const TYPES = ["theater","livehouse","arena","yose","outdoor","jazz","blackbox","dome","rooftop","manzai"];
  const CURT = ["split","rise","swag","pull","fold","drop"];
  const PAL = ["crimson","navy","emerald","violet","black","gold","joshiki","ivory"];
  const LIGHT = ["spot","cross","wash","sparkle","foot"];
  const COLORS = { // 幕の [濃い色, 明るい色]
    crimson:["#5e0f16","#a3222b"], navy:["#121c45","#2a3f8a"], emerald:["#0a3b2c","#167a5a"], violet:["#2c1245","#5f2f8c"],
    black:["#050506","#24242a"], gold:["#5b4310","#b0862a"], ivory:["#8f876f","#e2d9c2"], joshiki:["#111","#b4562f"],
  };
  const LIGHTCOL = ["#fff6d8","#ffd2a8","#bfe3ff","#ffc4ef","#d6ffd9"];
  const reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const today = new Date().toISOString().slice(0, 10);
  let seen = null;
  try { seen = localStorage.getItem("livehub:opening"); } catch {}
  window.livehubOpening = play;  // フッターの「オープニングを見る」から呼ぶ
  let off = false;
  try { off = localStorage.getItem("livehub:openingOff") === "1"; } catch {}
  const autoplay = !(reduced || off || seen === today);

  function play(){
    const box = document.getElementById("opening");
    if (!box) return;
    const no = Math.floor(Math.random() * V.length);
    const [ti, ci, pi, li, name] = V[no];
    const t = TYPES[ti], c = CURT[ci], p = PAL[pi], l = LIGHT[li];
    const [cd, cl] = COLORS[p];
    const lc = LIGHTCOL[no % LIGHTCOL.length];
    const fold = p === "joshiki"
      ? "repeating-linear-gradient(90deg,#111 0 33.3%,#b4562f 33.3% 66.6%,#2f6b3a 66.6% 100%)"
      : `repeating-linear-gradient(90deg,${cd} 0,${cl} 14px,${cd} 28px)`;
    const curtains = (c === "split" || c === "swag")
      ? `<div class="cur cur-l" style="background:${fold}"></div><div class="cur cur-r" style="background:${fold}"></div>`
      : `<div class="cur cur-1" style="background:${fold}"></div>`;
    const valance = ["theater","jazz","manzai","yose"].includes(t) ? `<div class="valance" style="--cd:${cd};--cl:${cl}"></div>` : "";
    box.className = `c-${c}`;
    box.innerHTML = `<svg class="scene" viewBox="0 0 400 700" preserveAspectRatio="xMidYMid slice">${scene(t, l, lc, no)}</svg>
      ${curtains}${valance}
      <div class="op-name"><small>本日の会場 No.${no + 1} / ${V.length}</small><b>${name}</b><em>※架空の会場です</em></div>
      <div class="op-logo">LIVE<b>HUB</b></div>
      <button class="op-skip" type="button">スキップ</button>`;
    box.hidden = false;
    box.classList.remove("bye", "open");
    try { localStorage.setItem("livehub:opening", today); } catch {}
    const timers = [setTimeout(() => box.classList.add("open"), 300), setTimeout(end, 1250)];
    function end(){
      timers.forEach(clearTimeout);
      box.classList.add("bye");
      setTimeout(() => { box.hidden = true; box.innerHTML = ""; }, 260);
    }
    box.onclick = end;
  }

  // ---- ピクトグラムの人(24x24の座標で描き、位置と大きさを変えて置く) ----
  const POSE = {
    stand:  '<circle cx="12" cy="3.6" r="2.6"/><path class="pl" d="M12 7.2v7M12 14.2 9.4 21.2M12 14.2l2.6 7M12 9 8.6 13M12 9l3.4 4"/>',
    up:     '<circle cx="12" cy="5.4" r="2.6"/><path class="pl" d="M12 9v6.2M12 15.2l-2.6 6M12 15.2l2.6 6M12 10.2 7 4.4M12 10.2l5-5.8"/>',
    mic:    '<circle cx="10" cy="3.8" r="2.6"/><circle cx="14.6" cy="5.6" r="1.6"/><path class="pl" d="M10 7.4v7M10 14.4 7.6 21.2M10 14.4l2.6 6.8M10 9.2l3.6 1.3.8-3.6M10 9.2 6.6 12.4"/>',
    spread: '<circle cx="11" cy="3.6" r="2.6"/><path class="pl" d="M11 7.2v6.8M11 14 8 21.2M11 14l3.4 7.2M11 9 18.6 6.4M11 9 7.4 11.8l2.6 1.6"/>',
    dance:  '<circle cx="15.2" cy="3.4" r="2.5"/><path class="pl" d="M14 7.2 11.4 13.6M13.5 8.6 19 5.6M13.5 8.6 7.6 7.4M11.4 13.6l3.4 3.6-1 4.6M11.4 13.6 6.6 17.8"/>',
    guitar: '<circle cx="12" cy="3.6" r="2.6"/><path class="pl" d="M12 7.2v7M12 14.2 9.4 21.2M12 14.2l2.6 7M12 9 9.6 12.8M12 9l4.2 3.4"/><ellipse cx="11.4" cy="13.4" rx="3.6" ry="2.4" transform="rotate(-28 11.4 13.4)"/><path class="pl" style="stroke-width:1.4" d="M13 12.4 19.6 8.2"/>',
    sit:    '<circle cx="11" cy="4" r="2.6"/><path class="pl" d="M11 7.6v6M11 13.6h5v7M11 9.4l3.8 2.6M7.6 21V12.4M7.6 15h3.4"/>',
    seiza:  '<circle cx="12" cy="8.2" r="2.6"/><path class="pl" d="M12 11.8v5.4M12 13.2l4.4-2.6M12 13.2 9 15.6"/><path d="M15.6 8.4l3.2-1.4.6 2.6z"/><rect x="6.5" y="17" width="11" height="2.6" rx="1.2"/>',
    tsukkomi:'<circle cx="12" cy="3.6" r="2.6"/><path class="pl" d="M12 7.2v7M12 14.2 9.4 21.2M12 14.2l2.6 7M12 9 8.4 6.6M12 9l3 4"/>',
    piano:  '<circle cx="9" cy="4" r="2.6"/><path class="pl" d="M9 7.6v6M9 13.6h4.6v7M9 9.4l5.4 1.8"/><rect x="13.6" y="9.6" width="10" height="2" rx=".6"/><path class="pl" style="stroke-width:1.6" d="M15 11.6v9.4M22.6 11.6v9.4"/>',
  };
  // x=中心, base=足元のy, size=高さ(px), col=色, flip=左右反転, cls=動き
  const person = (pose, x, base, size, col, flip = false, cls = "") => {
    const k = size / 24;
    const tf = `translate(${x - 12 * k * (flip ? -1 : 1)} ${base - 21.6 * k}) scale(${flip ? -k : k} ${k})`;
    // 動き(class)は外側の<g>、位置と大きさ(transform)は内側の<g>に分ける(CSSの動きが位置を上書きしないように)
    return `<g class="${cls}"><g transform="${tf}" fill="${col}" stroke="${col}">${POSE[pose]}</g></g>`;
  };
  // 客席(ピクトグラムの人を並べる)。armsUp=true なら手を上げて盛り上がる
  const crowd = (y, n, size, col, armsUp, R) => Array.from({length: n}, (_, i) => {
    const x = (i + .5) * 400 / n + R(10) - 5;
    return person(armsUp && R(1) > .35 ? "up" : "stand", x, y + R(6), size * (.9 + R(.2)), col);
  }).join("");
  const seats = (y, n, col, R) => Array.from({length: n}, (_, i) => {
    const x = (i + .5) * 400 / n + R(6) - 3;
    return `<circle cx="${x}" cy="${y}" r="9" fill="${col}"/><rect x="${x - 13}" y="${y + 8}" width="26" height="22" rx="9" fill="${col}"/>`;
  }).join("");

  // ---- 会場の絵(400x700)。平らな形と、ピクトグラムの人だけで描く ----
  function scene(t, l, lc, seed){
    const R = n => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280 * n; };
    const P = "#f4f1e8";            // 出演者の色
    const A = "#3a3a46", A2 = "#24242c";  // お客さんの色
    let bg = "#0b0b10", s = "", cast = "", aud = "";
    const floor = `<rect x="0" y="560" width="400" height="140" fill="#17130f"/><rect x="0" y="552" width="400" height="10" fill="#2b2119"/>`;
    switch (t) {
      case "theater":
        s += `<rect x="22" y="62" width="356" height="496" fill="none" stroke="#b08a3a" stroke-width="12"/>${floor}`;
        cast = person("spread", 150, 555, 150, P, false, "pop") + person("spread", 262, 555, 140, P, true, "pop2");
        aud = seats(640, 9, A2, R); break;
      case "livehouse":
        bg = "#08080c";
        s += `<rect x="0" y="70" width="400" height="12" fill="#2e2e36"/>${[40,110,180,250,320].map(x => `<rect x="${x}" y="82" width="34" height="18" rx="4" fill="#1d1d24"/>`).join("")}
          <rect x="16" y="390" width="62" height="168" fill="#141419"/><rect x="322" y="390" width="62" height="168" fill="#141419"/>${floor}`;
        cast = person("mic", 175, 555, 150, P, false, "pop") + person("guitar", 265, 555, 140, P, false, "pop2");
        aud = crowd(690, 7, 70, A, true, R); break;
      case "arena":
        bg = "#05060c";
        s += `<rect x="10" y="150" width="110" height="78" fill="#15223e"/><rect x="280" y="150" width="110" height="78" fill="#15223e"/>
          <g fill="#ffe9b0" class="fx">${Array.from({length: 12}, (_, i) => `<circle cx="${20 + i * 33}" cy="80" r="5"/>`).join("")}</g>${floor}`;
        cast = person("mic", 200, 545, 120, P, false, "pop") + person("dance", 120, 548, 96, P, true, "pop2") + person("dance", 285, 548, 96, P, false, "pop2");
        aud = crowd(650, 9, 64, A, true, R) + crowd(700, 11, 64, A2, true, R); break;
      case "yose":
        bg = "#1a120c";
        s += `${[60,140,220,300].map(x => `<ellipse cx="${x + 20}" cy="110" rx="18" ry="26" fill="#c43b2a"/>`).join("")}
          <rect x="80" y="470" width="240" height="90" fill="#3a2716"/>
          <rect x="332" y="380" width="44" height="120" fill="#eee6d3"/><rect x="350" y="500" width="8" height="60" fill="#3a2716"/>${floor}`;
        cast = person("seiza", 200, 474, 130, P, false, "pop");
        aud = seats(640, 9, A2, R); break;
      case "outdoor":
        bg = "#0b1030";
        s += `<circle cx="320" cy="120" r="34" fill="#f3efd9" opacity=".9"/>${Array.from({length: 26}, () => `<circle class="tw" cx="${R(400)}" cy="${R(300)}" r="${1 + R(1.6)}" fill="#fff"/>`).join("")}
          <path d="M0 470 Q120 400 220 450 T400 430 V560 H0Z" fill="#0d1a14"/><polygon points="80,300 320,300 350,560 50,560" fill="#151519"/>
          <polygon points="60,300 340,300 200,236" fill="#22222b"/>${floor}`;
        cast = person("guitar", 130, 555, 120, P, false, "pop2") + person("mic", 205, 555, 130, P, false, "pop") + person("guitar", 280, 555, 120, P, true, "pop2");
        aud = crowd(660, 9, 66, A, true, R) + crowd(705, 11, 64, A2, true, R); break;
      case "jazz":
        bg = "#160e08";
        s += `<circle cx="90" cy="300" r="70" fill="#ffcf80" opacity=".08" class="fx"/>${floor}
          <ellipse cx="70" cy="640" rx="44" ry="10" fill="#2a1d12"/><rect x="67" y="640" width="6" height="60" fill="#2a1d12"/>
          <ellipse cx="330" cy="640" rx="44" ry="10" fill="#2a1d12"/><rect x="327" y="640" width="6" height="60" fill="#2a1d12"/>`;
        cast = person("piano", 255, 555, 130, P, false, "pop2") + person("mic", 135, 555, 140, P, false, "pop");
        aud = seats(690, 5, A2, R); break;
      case "blackbox":
        bg = "#030303";
        s += floor;
        cast = person("sit", 200, 555, 140, P, false, "pop");
        aud = seats(650, 7, A2, R); break;
      case "dome":
        bg = "#04050a";
        s += `<path d="M-20 300 Q200 -40 420 300" fill="none" stroke="#1d2238" stroke-width="10"/>${[60,130,200,270,340].map(x => `<path d="M${x} 300 Q200 ${40 + Math.abs(x - 200) / 2} ${400 - x} 300" fill="none" stroke="#151a2c" stroke-width="3"/>`).join("")}${floor}`;
        cast = person("mic", 200, 548, 110, P, false, "pop");
        aud = crowd(630, 10, 58, A, true, R) + crowd(670, 12, 58, A, true, R) + crowd(710, 14, 58, A2, true, R); break;
      case "rooftop":
        bg = "#0d0b25";
        s += `${Array.from({length: 14}, (_, i) => { const h = 80 + R(160); return `<rect x="${i * 30}" y="${560 - h - 120}" width="26" height="${h}" fill="#141432"/>`; }).join("")}
          ${Array.from({length: 30}, () => `<rect class="tw" x="${R(400)}" y="${300 + R(120)}" width="3" height="4" fill="#ffe7a0"/>`).join("")}
          <rect x="0" y="540" width="400" height="6" fill="#444"/>${floor}`;
        cast = person("mic", 165, 555, 140, P, false, "pop") + person("guitar", 255, 555, 132, P, false, "pop2");
        aud = crowd(680, 8, 66, A, true, R); break;
      case "manzai":
        bg = "#12100a";
        s += `<circle cx="200" cy="290" r="96" fill="#2a2416"/>${floor}
          <rect x="197" y="430" width="6" height="128" fill="#9a9a9a"/><rect x="189" y="398" width="22" height="38" rx="11" fill="#c8c8c8"/><path d="M175 560 a25 10 0 0 1 50 0z" fill="#9a9a9a"/>`;
        cast = person("stand", 135, 555, 150, P, false, "pop") + person("tsukkomi", 265, 555, 150, P, true, "pop2");
        aud = seats(640, 9, A2, R); break;
    }
    // 照明(幕が開いてからふわっと出る)
    let fx = "";
    if (l === "spot") fx = `<polygon points="185,0 215,0 290,560 110,560" fill="${lc}" opacity=".16"/><ellipse cx="200" cy="560" rx="95" ry="16" fill="${lc}" opacity=".35"/>`;
    if (l === "cross") fx = `<polygon points="0,0 30,0 300,560 180,560" fill="${lc}" opacity=".14"/><polygon points="370,0 400,0 220,560 100,560" fill="${lc}" opacity=".14"/>`;
    if (l === "wash") fx = `<rect x="0" y="0" width="400" height="560" fill="${lc}" opacity=".12"/>`;
    if (l === "sparkle") fx = Array.from({length: 40}, () => `<circle class="tw" cx="${R(400)}" cy="${R(540)}" r="${1 + R(2)}" fill="${lc}"/>`).join("");
    if (l === "foot") fx = Array.from({length: 9}, (_, i) => `<ellipse cx="${24 + i * 44}" cy="556" rx="18" ry="8" fill="${lc}" opacity=".55"/>`).join("") + `<rect x="0" y="380" width="400" height="180" fill="${lc}" opacity=".06"/>`;
    return `<rect width="400" height="700" fill="${bg}"/>${s}<g class="fx">${fx}</g><g class="cast">${cast}</g>${aud}`;
  }
  if (autoplay) play();  // 人や会場の描き方を読み込んでから始める
})();
</script>
