<!-- オープニング演出:1日1回、架空の会場の幕が開く。タップで飛ばせる。動きを減らす設定では出さない -->
<style>
#opening{position:fixed;inset:0;z-index:100;overflow:hidden;background:#000;cursor:pointer;opacity:1;transition:opacity .35s ease}
#opening.bye{opacity:0;pointer-events:none}
#opening .scene{position:absolute;inset:0;width:100%;height:100%}
#opening .cur{position:absolute;top:0;bottom:0;will-change:transform;transition:transform .85s cubic-bezier(.65,0,.35,1)}
#opening .cur-l{left:0;width:51%;transform-origin:0 0}
#opening .cur-r{right:0;width:51%;transform-origin:100% 0}
#opening .cur-1{left:0;right:0}
#opening .valance{position:absolute;left:0;right:0;top:0;height:9%;z-index:3;
  background:radial-gradient(ellipse 40px 26px at 40px 0,var(--cd) 98%,transparent) 0 100%/80px 30px repeat-x,linear-gradient(var(--cd),var(--cl));box-shadow:0 6px 18px rgba(0,0,0,.6)}
#opening .op-name{position:absolute;left:0;right:0;top:40%;z-index:4;text-align:center;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.8);transition:opacity .4s}
#opening .op-name small{display:block;font-size:12px;letter-spacing:.2em;opacity:.85}
#opening .op-name b{display:block;font-size:26px;margin:6px 16px;line-height:1.3}
#opening .op-name em{font-style:normal;font-size:11px;opacity:.7}
#opening .op-logo{position:absolute;left:0;right:0;top:44%;z-index:4;text-align:center;font:900 40px/1 system-ui,sans-serif;letter-spacing:.06em;color:#fff;opacity:0;transform:scale(.9);transition:opacity .5s .1s,transform .6s .1s;text-shadow:0 0 24px rgba(255,255,255,.35)}
#opening .op-logo b{color:#ff5a36}
#opening .op-skip{position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:5;background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 14px;font:inherit;font-size:12px}
#opening .fx{opacity:0;transition:opacity .6s .35s}
#opening.open .fx{opacity:1}
#opening.open .op-name{opacity:0}
#opening.open .op-logo{opacity:1;transform:none}
/* 幕の開き方 */
#opening.open.c-split .cur-l{transform:translateX(-102%)}
#opening.open.c-split .cur-r{transform:translateX(102%)}
#opening.open.c-swag .cur-l{transform:scaleX(.16) skewY(-8deg)}
#opening.open.c-swag .cur-r{transform:scaleX(.16) skewY(8deg)}
#opening.open.c-rise .cur-1{transform:translateY(-100%)}
#opening.open.c-pull .cur-1{transform:translateX(102%)}
#opening.c-fold .cur-1{transform-origin:50% 0}
#opening.open.c-fold .cur-1{transform:scaleY(0)}
#opening.open.c-drop .cur-1{transform:translateY(105%)}
#opening.c-drop .cur-1{transition-timing-function:cubic-bezier(.55,0,1,.45)}
/* きらめき(点滅ではなく、ゆっくり明るさが変わるだけ) */
#opening .tw{animation:tw 1.6s ease-in-out infinite alternate}
#opening .tw:nth-child(3n){animation-delay:.5s}
#opening .tw:nth-child(3n+1){animation-delay:1s}
@keyframes tw{from{opacity:.25}to{opacity:1}}
@media (prefers-reduced-motion: reduce){#opening{display:none}}
</style>
<div id="opening" hidden aria-hidden="true"></div>
<script>
(() => {
  const V = /*__OPENING__*/[];
  if (!V.length) return;
  const TYPES = ["theater","livehouse","arena","yose","outdoor","jazz","blackbox","dome","rooftop","manzai"];
  const CURT = ["split","rise","swag","pull","fold","drop"];
  const PAL = ["crimson","navy","emerald","violet","black","gold","joshiki","ivory"];
  const LIGHT = ["spot","cross","wash","sparkle","foot"];
  const COLORS = { // 幕の [濃い色, 明るい色]
    crimson:["#5e0f16","#a3222b"], navy:["#121c45","#2a3f8a"], emerald:["#0a3b2c","#167a5a"], violet:["#2c1245","#5f2f8c"],
    black:["#050506","#24242a"], gold:["#5b4310","#b0862a"], ivory:["#8f876f","#e2d9c2"], joshiki:["#111","#b4562f"],
  };
  const LIGHTCOL = ["#fff6d8","#ffd2a8","#bfe3ff","#ffc4ef","#d6ffd9"];
  const reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const today = new Date().toISOString().slice(0, 10);
  let seen = null;
  try { seen = localStorage.getItem("livehub:opening"); } catch {}
  window.livehubOpening = play;  // フッターの「オープニングを見る」から呼ぶ
  if (reduced || seen === today) return;
  play();

  function play(){
    const box = document.getElementById("opening");
    if (!box) return;
    const no = Math.floor(Math.random() * V.length);
    const [ti, ci, pi, li, name] = V[no];
    const t = TYPES[ti], c = CURT[ci], p = PAL[pi], l = LIGHT[li];
    const [cd, cl] = COLORS[p];
    const lc = LIGHTCOL[no % LIGHTCOL.length];
    const fold = p === "joshiki"
      ? "repeating-linear-gradient(90deg,#111 0 33.3%,#b4562f 33.3% 66.6%,#2f6b3a 66.6% 100%)"
      : `repeating-linear-gradient(90deg,${cd} 0,${cl} 14px,${cd} 28px)`;
    const curtains = (c === "split" || c === "swag")
      ? `<div class="cur cur-l" style="background:${fold}"></div><div class="cur cur-r" style="background:${fold}"></div>`
      : `<div class="cur cur-1" style="background:${fold}"></div>`;
    const valance = ["theater","jazz","manzai","yose"].includes(t) ? `<div class="valance" style="--cd:${cd};--cl:${cl}"></div>` : "";
    box.className = `c-${c}`;
    box.innerHTML = `<svg class="scene" viewBox="0 0 400 700" preserveAspectRatio="xMidYMid slice">${scene(t, l, lc, no)}</svg>
      ${curtains}${valance}
      <div class="op-name"><small>本日の会場 No.${no + 1} / ${V.length}</small><b>${name}</b><em>※架空の会場です</em></div>
      <div class="op-logo">LIVE<b>HUB</b></div>
      <button class="op-skip" type="button">スキップ</button>`;
    box.hidden = false;
    box.classList.remove("bye", "open");
    try { localStorage.setItem("livehub:opening", today); } catch {}
    const timers = [setTimeout(() => box.classList.add("open"), 650), setTimeout(end, 2300)];
    function end(){
      timers.forEach(clearTimeout);
      box.classList.add("bye");
      setTimeout(() => { box.hidden = true; box.innerHTML = ""; }, 380);
    }
    box.onclick = end;
  }

  // ---- 会場の絵(400x700)。どれも単純な図形だけで描く ----
  function scene(t, l, lc, seed){
    const R = n => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280 * n; };
    let bg = "#0b0b10", s = "";
    const floor = `<polygon points="0,560 400,560 400,700 0,700" fill="#1a1410"/><rect x="0" y="552" width="400" height="10" fill="#2a2018"/>`;
    const crowd = (y, n, col) => Array.from({length: n}, (_, i) => `<circle cx="${(i + .5) * 400 / n + R(8) - 4}" cy="${y + R(10)}" r="${10 + R(5)}" fill="${col}"/>`).join("");
    switch (t) {
      case "theater":
        s += `<rect x="20" y="60" width="360" height="500" fill="none" stroke="#b08a3a" stroke-width="14"/>${floor}${crowd(640, 9, "#0d0b0a")}`; break;
      case "livehouse":
        bg = "#08080c";
        s += `<rect x="0" y="70" width="400" height="14" fill="#333"/><g fill="#1c1c22">${[30,90,150,210,270,330].map(x => `<rect x="${x}" y="84" width="40" height="22" rx="4"/>`).join("")}</g>
          <rect x="18" y="380" width="70" height="180" fill="#151519"/><rect x="312" y="380" width="70" height="180" fill="#151519"/>
          <circle cx="53" cy="430" r="22" fill="#222"/><circle cx="347" cy="430" r="22" fill="#222"/>${floor}
          <rect x="198" y="440" width="4" height="120" fill="#555"/><rect x="190" y="430" width="20" height="12" rx="6" fill="#777"/>${crowd(630, 8, "#050505")}`; break;
      case "arena":
        bg = "#05060c";
        s += `<rect x="10" y="150" width="110" height="80" fill="#14223f"/><rect x="280" y="150" width="110" height="80" fill="#14223f"/>
          <g fill="#ffe9b0" class="fx">${Array.from({length: 12}, (_, i) => `<circle cx="${20 + i * 33}" cy="80" r="5"/>`).join("")}</g>${floor}
          ${crowd(600, 11, "#07070a")}${crowd(650, 13, "#040406")}`; break;
      case "yose":
        bg = "#1a120c";
        s += `<g>${[60,140,220,300].map(x => `<ellipse cx="${x + 20}" cy="110" rx="18" ry="26" fill="#c43b2a"/><rect x="${x + 14}" y="80" width="12" height="6" fill="#222"/>`).join("")}</g>
          <rect x="70" y="470" width="260" height="90" fill="#3a2716"/><rect x="170" y="452" width="60" height="20" rx="4" fill="#7a2a3a"/>
          <rect x="330" y="380" width="44" height="120" fill="#eee6d3"/><rect x="348" y="500" width="8" height="60" fill="#3a2716"/>${floor}`; break;
      case "outdoor":
        bg = "#0b1030";
        s += `<circle cx="320" cy="120" r="34" fill="#f3efd9" opacity=".9"/>${Array.from({length: 26}, () => `<circle class="tw" cx="${R(400)}" cy="${R(300)}" r="${1 + R(1.6)}" fill="#fff"/>`).join("")}
          <path d="M0 470 Q120 400 220 450 T400 430 V560 H0Z" fill="#0d1a14"/><polygon points="90,300 310,300 360,560 40,560" fill="#141418" opacity=".9"/>
          <polygon points="70,300 330,300 200,240" fill="#202028"/>${floor}${crowd(630, 10, "#06070a")}`; break;
      case "jazz":
        bg = "#160e08";
        s += `<path d="M230 470 h120 a20 20 0 0 1 20 20 v20 h-170 v-25 q0-15 30-15z" fill="#0c0806"/><rect x="240" y="510" width="6" height="50" fill="#0c0806"/><rect x="340" y="510" width="6" height="50" fill="#0c0806"/>
          <ellipse cx="120" cy="620" rx="40" ry="10" fill="#2a1d12"/><rect x="117" y="620" width="6" height="60" fill="#2a1d12"/>
          <circle cx="90" cy="300" r="60" fill="#ffcf80" opacity=".08" class="fx"/>${floor}`; break;
      case "blackbox":
        bg = "#030303";
        s += `<rect x="185" y="480" width="30" height="6" fill="#2a2a2a"/><rect x="186" y="486" width="4" height="60" fill="#2a2a2a"/><rect x="210" y="486" width="4" height="60" fill="#2a2a2a"/><rect x="186" y="440" width="4" height="44" fill="#2a2a2a"/>${floor}`; break;
      case "dome":
        bg = "#04050a";
        s += `<path d="M-20 300 Q200 -40 420 300" fill="none" stroke="#1d2238" stroke-width="10"/>${[60,130,200,270,340].map(x => `<path d="M${x} 300 Q200 ${40 + Math.abs(x - 200) / 2} ${400 - x} 300" fill="none" stroke="#151a2c" stroke-width="3"/>`).join("")}
          ${floor}${crowd(590, 12, "#06060a")}${crowd(640, 14, "#030305")}`; break;
      case "rooftop":
        bg = "#0d0b25";
        s += `${Array.from({length: 14}, (_, i) => { const h = 80 + R(160); return `<rect x="${i * 30}" y="${560 - h - 120}" width="26" height="${h}" fill="#141432"/>`; }).join("")}
          ${Array.from({length: 30}, () => `<rect class="tw" x="${R(400)}" y="${300 + R(120)}" width="3" height="4" fill="#ffe7a0"/>`).join("")}
          <rect x="0" y="540" width="400" height="6" fill="#444"/>${floor}`; break;
      case "manzai":
        bg = "#12100a";
        s += `<circle cx="200" cy="300" r="90" fill="#2a2416"/><rect x="196" y="420" width="8" height="140" fill="#888"/>
          <rect x="186" y="380" width="28" height="46" rx="14" fill="#bbb"/><path d="M170 562 a30 12 0 0 1 60 0z" fill="#888"/>${floor}`; break;
    }
    // 照明(幕が開いてからふわっと出る)
    let fx = "";
    if (l === "spot") fx = `<polygon points="185,0 215,0 290,560 110,560" fill="${lc}" opacity=".16"/><ellipse cx="200" cy="560" rx="95" ry="16" fill="${lc}" opacity=".35"/>`;
    if (l === "cross") fx = `<polygon points="0,0 30,0 300,560 180,560" fill="${lc}" opacity=".14"/><polygon points="370,0 400,0 220,560 100,560" fill="${lc}" opacity=".14"/>`;
    if (l === "wash") fx = `<rect x="0" y="0" width="400" height="560" fill="${lc}" opacity=".12"/>`;
    if (l === "sparkle") fx = Array.from({length: 40}, () => `<circle class="tw" cx="${R(400)}" cy="${R(540)}" r="${1 + R(2)}" fill="${lc}"/>`).join("");
    if (l === "foot") fx = Array.from({length: 9}, (_, i) => `<ellipse cx="${24 + i * 44}" cy="556" rx="18" ry="8" fill="${lc}" opacity=".55"/>`).join("") + `<rect x="0" y="380" width="400" height="180" fill="${lc}" opacity=".06"/>`;
    return `<rect width="400" height="700" fill="${bg}"/>${s}<g class="fx">${fx}</g>`;
  }
})();
</script>
