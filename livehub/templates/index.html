<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIVEHUB — 全国のライブ・お笑い・舞台情報をひとつに</title>
<meta name="description" content="全国の会場・イベンター・劇場・事務所・主催者の公式発表を横断して集約。新しく発表された公演を見逃さない。">
<style>
:root{
  --bg:#0f0f12;--panel:#17171c;--line:#2a2a33;--text:#f1f0ea;--sub:#a3a2a8;--dim:#6f6e76;
  --accent:#ff5a36;--accent-ink:#1a0a05;
  --music:#ff5a36;--comedy:#ffc93c;--musical:#e86bd9;--stage:#5ab0ff;
  --radius:14px;
  font-synthesis:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.55}
a{color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 80px}
header.top{position:sticky;top:0;z-index:5;background:rgba(15,15,18,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;padding:14px 0 8px}
.logo{font-weight:900;letter-spacing:.06em;font-size:22px}
.logo b{color:var(--accent)}
.tagline{color:var(--sub);font-size:12px}
.sample{margin:10px 0 0;padding:8px 12px;border:1px dashed var(--comedy);color:var(--comedy);
  border-radius:10px;font-size:12px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:transparent;color:var(--sub);
  padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.tab[aria-selected=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
.tab .n{font-weight:500;margin-left:6px;opacity:.7;font-size:12px}
.filters{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:14px 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--sub);border-radius:999px;
  padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{color:var(--text);border-color:var(--text)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.pic{width:18px;height:18px;margin-right:6px;vertical-align:-4px;fill:currentColor;flex:none}
.pic .st{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.chip[data-genre=music] .pic{color:var(--music)}
.chip[data-genre=comedy] .pic{color:var(--comedy)}
.chip[data-genre=musical] .pic{color:var(--musical)}
.chip[data-genre=stage] .pic{color:var(--stage)}
#freeOnly .pic{color:#3ddc97}
#openFollow .pic{color:var(--comedy)}
.row{display:flex;gap:8px}
input[type=search],select{flex:1;min-width:0;width:0;background:var(--panel);color:var(--text);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;font:inherit;font-size:15px}
.hint{color:var(--dim);font-size:12px;margin:6px 0 0}
.group{margin-top:22px}
.group h2{font-size:13px;color:var(--sub);font-weight:700;letter-spacing:.08em;margin:0 0 8px;
  padding-bottom:6px;border-bottom:1px solid var(--line)}
.card{position:relative;display:grid;grid-template-columns:58px 1fr auto;gap:12px;padding:14px 0;
  border-bottom:1px solid var(--line)}
.date{text-align:center;line-height:1.1}
.date .m{font-size:11px;color:var(--sub)}
.date .d{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.date .w{font-size:11px;color:var(--sub)}
.date.none .d{font-size:13px;color:var(--dim);font-weight:600;padding-top:6px}
.title{font-weight:700;font-size:15px;text-decoration:none;display:block}
.title:hover{text-decoration:underline}
.meta{color:var(--sub);font-size:12.5px;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 10px}
.badges{display:flex;gap:6px;margin-bottom:4px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px;letter-spacing:.04em}
.g-music{background:var(--music);color:var(--accent-ink)}
.g-comedy{background:var(--comedy);color:#1d1600}
.g-musical{background:var(--musical);color:#20061d}
.g-stage{background:var(--stage);color:#04162a}
.k-new{border:1px solid var(--accent);color:var(--accent)}
.k-free{background:#3ddc97;color:#04210f}
.k-house{border:1px solid #c9b27a;color:#e8d6a6}
.k-special{background:#c9b27a;color:#1f1704}
.perf{color:var(--sub);font-size:12.5px;margin-top:4px;line-height:1.9}
.pf{background:none;border:0;padding:0 2px;font:inherit;color:var(--text);text-decoration:underline dotted #6f6e76;text-underline-offset:3px;cursor:pointer}
.pf.on{color:var(--comedy);text-decoration-color:var(--comedy)}
.pf.on::before{content:"★"}
#houses{display:none}
body.theater #houses{display:flex}
body.theater #genres{display:none}
.daygroup h2{display:flex;justify-content:space-between}
.today{color:var(--accent)}
.tix{display:inline-block;margin-top:6px;font-size:12px;color:var(--sub);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.tix:hover{color:var(--text);border-color:var(--sub)}
.star{background:none;border:0;color:var(--dim);font-size:20px;cursor:pointer;padding:0 4px;height:32px}
.star[aria-pressed=true]{color:var(--comedy)}
.src{color:var(--dim);font-size:11.5px;margin-top:4px}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:14px}
.follow-list{display:flex;flex-wrap:wrap;gap:6px}
footer{color:var(--dim);font-size:12px;padding:30px 0;border-top:1px solid var(--line);margin-top:30px}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:var(--radius);
  max-width:420px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 14px;
  font:inherit;font-weight:800;cursor:pointer}
.btn.ghost{background:none;color:var(--sub);border:1px solid var(--line)}
.mapbox{background:#1c1c23;border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px 12px}
.maphead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub)}
.maphead b{color:var(--text);font-size:15px}
.maphead button{background:none;border:1px solid var(--line);color:var(--sub);border-radius:999px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
.jmap{display:block;width:100%;max-width:340px;margin:4px auto 0}
.mapbox.closed .jmap,.mapbox.closed #prefchips{display:none}
.rg{cursor:pointer;outline:none}
.rg polygon{fill:#000;stroke:#5a5a66;stroke-width:2.5;stroke-linejoin:round;transition:fill .15s}
.rg:hover polygon,.rg:focus-visible polygon{fill:#2b2b33}
.rg.on polygon{fill:var(--accent);stroke:#ffb59f}
.rg.dim polygon{fill:#0b0b0e;stroke:#33333b}
.rg text{fill:#f1f0ea;font:700 24px "Hiragino Sans","Noto Sans JP",sans-serif;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#000;stroke-width:5px}
.rg.on text{fill:#fff;stroke:#7a2410}
.rg text.cnt{font-size:18px;font-weight:600;fill:#c9c8c2}
.inset{fill:none;stroke:#4a4a55;stroke-dasharray:6 5}
.insetlabel{fill:#8c8b92;font:15px sans-serif}
#prefchips{margin-top:10px}
#prefchips .chip{font-size:12.5px;padding:5px 10px}
#prefchips .chip .n{opacity:.6;margin-left:4px;font-size:11px}
/* 押した瞬間に1回だけ動く。動きを減らす設定の人には動かさない */
.pic{transform-origin:50% 90%}
.pic.go-music{animation:sway .45s ease-in-out}
.pic.go-comedy{animation:nudge .35s ease-out}
.pic.go-musical{animation:hop .45s cubic-bezier(.3,1.6,.5,1)}
.pic.go-stage{animation:pose .45s ease-out}
.pic.go-free{animation:bounce2 .5s ease-out}
.pic.go-follow{animation:spin .5s ease-in-out;transform-origin:50% 50%}
@keyframes sway{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@keyframes nudge{30%{transform:translateX(3px)}60%{transform:translateX(-2px)}}
@keyframes hop{40%{transform:translateY(-5px) rotate(-8deg)}}
@keyframes pose{40%{transform:scale(1.3)}}
@keyframes bounce2{25%{transform:translateY(-4px)}50%{transform:none}75%{transform:translateY(-3px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.pic[class*="go-"]{animation:none}}
@media (min-width:700px){.card{grid-template-columns:70px 1fr auto}.date .d{font-size:28px}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap" style="padding-bottom:0">
    <div class="brand"><span class="logo">LIVE<b>HUB</b></span><span class="tagline">全国のライブ・お笑い・舞台を、見逃さない。</span></div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>

<main class="wrap">
  <div id="sample"></div>
  <section class="filters">
    <div class="chips" id="houses"></div>
    <div class="chips" id="genres"></div>
    <div class="mapbox" id="mapbox">
      <div class="maphead"><span>エリア：<b id="areaLabel">全国</b></span>
        <span><button id="allJapan">全国に戻す</button> <button id="mapToggle">地図をたたむ</button></span></div>
      <!--MAP-->
      <div class="chips" id="prefchips"></div>
    </div>
    <div class="row">
      <input type="search" id="q" placeholder="キーワード(出演者・会場など)">
    </div>
    <p class="hint" id="hint"></p>
  </section>
  <div id="list"></div>
  <footer>
    <p>掲載情報は各公式サイト(会場・イベンター・劇場・事務所・主催者)の公開情報をもとにしています。チケットの販売・先行情報は掲載していません。ファンクラブ先行などが最も早いことが多いため、必ず公式サイトでご確認ください。日時・出演者・発売情報は必ずリンク先の公式情報でご確認ください。</p>
    <p><a href="about.html">このサイトについて・情報源一覧・掲載停止のご依頼</a> ・ <span id="gen"></span></p>
  </footer>
</main>

<dialog id="followDlg">
  <form method="dialog">
    <h3 style="margin-top:0">★ フォロー</h3>
    <p style="color:var(--sub);font-size:13px">フォローしたアーティスト・会場・地域の情報だけを「フォロー中」タブで見られます。この端末にだけ保存されます。</p>
    <div class="follow-list" id="followList"></div>
    <div class="row" style="margin-top:12px">
      <input type="search" id="followInput" placeholder="例: King Gnu / Zepp Nagoya / 福岡県">
      <button class="btn" id="followAdd" value="add">追加</button>
    </div>
    <p style="text-align:right;margin-bottom:0"><button class="btn ghost" value="close">閉じる</button></p>
  </form>
</dialog>

<script>
const DATA = /*__DATA__*/null;
(async () => {
const data = DATA || await (await fetch("events.json")).json();
const {meta, events} = data;
const TODAY = new Date(meta.today + "T00:00:00");
const store = {
  get(k, d){ try { return JSON.parse(localStorage.getItem("livehub:"+k)) ?? d } catch { return d } },
  set(k, v){ try { localStorage.setItem("livehub:"+k, JSON.stringify(v)) } catch {} }
};
// 「前回の訪問以降に見つかったもの」= 新着。初回は直近3日分。
const lastVisit = store.get("lastVisit", null);
const since = lastVisit ? new Date(lastVisit) : new Date(TODAY.getTime() - 3*864e5);
addEventListener("pagehide", () => store.set("lastVisit", new Date().toISOString()));

const PREF_REGION = {"北海道":"北海道","青森県":"東北","岩手県":"東北","宮城県":"東北","秋田県":"東北","山形県":"東北","福島県":"東北","茨城県":"関東","栃木県":"関東","群馬県":"関東","埼玉県":"関東","千葉県":"関東","東京都":"関東","神奈川県":"関東","新潟県":"中部","富山県":"中部","石川県":"中部","福井県":"中部","山梨県":"中部","長野県":"中部","岐阜県":"中部","静岡県":"中部","愛知県":"中部","三重県":"近畿","滋賀県":"近畿","京都府":"近畿","大阪府":"近畿","兵庫県":"近畿","奈良県":"近畿","和歌山県":"近畿","鳥取県":"中国","島根県":"中国","岡山県":"中国","広島県":"中国","山口県":"中国","徳島県":"四国","香川県":"四国","愛媛県":"四国","高知県":"四国","福岡県":"九州・沖縄","佐賀県":"九州・沖縄","長崎県":"九州・沖縄","熊本県":"九州・沖縄","大分県":"九州・沖縄","宮崎県":"九州・沖縄","鹿児島県":"九州・沖縄","沖縄県":"九州・沖縄"};
const HOUSES = meta.houses || {};
// ピクトグラム(24x24)。色は各ボタンのCSSで付ける
const ICON = {
  music: '<circle cx="10" cy="3.8" r="2.5"/><circle cx="14.6" cy="5.6" r="1.6"/><path class="st" d="M10 7.4v7M10 14.4 7.6 21.2M10 14.4l2.6 6.8M10 9.2l3.6 1.3.8-3.6M10 9.2 6.6 12.4"/>',
  comedy: '<circle cx="5.2" cy="4.6" r="2.2"/><circle cx="18.8" cy="4.6" r="2.2"/><circle cx="12" cy="9.2" r="1.7"/><path class="st" style="stroke-width:2.2" d="M12 10.8v10.6M5.2 7.6v6.6M5.2 14.2l-1.8 7M5.2 14.2l1.8 7M5.2 9.4l4.6 1.2M18.8 7.6v6.6M18.8 14.2l-1.8 7M18.8 14.2l1.8 7M18.8 9.4l-3.6-3"/>',
  musical: '<circle cx="15.2" cy="3.4" r="2.5"/><path class="st" style="stroke-width:3.2" d="M14 7.2 11.4 13.6"/><path class="st" d="M13.5 8.6 19 5.6M13.5 8.6 7.6 7.4M11.4 13.6l3.4 3.6-1 4.6M11.4 13.6 6.6 17.8"/>',
  stage: '<circle cx="11" cy="3.6" r="2.5"/><rect x="2" y="20.6" width="20" height="2.2" rx="1"/><path class="st" d="M11 7.2v6.8M11 14 8 19.4M11 14l3.4 5.4M11 9 18.6 6.4M11 9 7.4 11.8l2.6 1.6"/>',
  free: '<circle cx="12" cy="6.4" r="2.5"/><path class="st" d="M12 10v6.4M12 16.4l-2.6 5.2M12 16.4l2.6 5.2M12 11 6.4 4.4M12 11l5.6-6.6"/>',
  follow: '<circle cx="9" cy="5.2" r="2.5"/><path class="st" d="M9 8.8v6.6M9 15.4l-2.4 6M9 15.4l2.4 6M9 10.4 5.4 13.4M9 10.4l3.6 3"/><path d="M18.5 2.2l1.4 2.9 3.1.4-2.3 2.2.6 3.1-2.8-1.5-2.8 1.5.6-3.1-2.3-2.2 3.1-.4z"/>',
};
const pic = k => `<svg class="pic" data-pic="${k}" viewBox="0 0 24 24" aria-hidden="true">${ICON[k] || ""}</svg>`;
// 押したボタンのアイコンを1回だけ動かす(描き直したあとの新しいボタンを探して付ける)
function wiggle(selector){
  const svg = document.querySelector(selector + " .pic"); if (!svg) return;
  const cls = "go-" + svg.dataset.pic;
  svg.classList.remove(cls); void svg.getBoundingClientRect(); svg.classList.add(cls);
  svg.addEventListener("animationend", () => svg.classList.remove(cls), {once: true});
}
const st = {tab:"new", house:Object.keys(HOUSES)[0] || "", free:false, genres:new Set(), region:"", pref:"", q:"", follows:new Set(store.get("follows", []))};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const d = s => s ? new Date(s.length <= 10 ? s + "T00:00:00" : s) : null;
const W = "日月火水木金土";
const days = (a) => Math.round((a - TODAY) / 864e5);

events.forEach(e => {
  e._first = d(e.first_seen); e._start = d(e.start_date); e._end = d(e.end_date); e._sale = d(e.ticket_sale_at);
  e._hay = [e.title, e.venue, e.prefecture, ...(e.performers||[]), ...(e.source_names||[])].join(" ").toLowerCase();
});
const isNew = e => e._first && e._first > since;
const followed = e => [...st.follows].some(f => e._hay.includes(f.toLowerCase()));

// 専用劇場(吉本・宝塚・四季・歌舞伎)の「日々の公演」は通常の一覧に出さず、劇場スケジュールにだけ出す
const isDaily = e => !!e.house && e.kind === "event" && !e.special;
const TABS = [
  ["new", "新着", e => !isDaily(e) && isNew(e)],
  ["upcoming", "開催予定", e => !isDaily(e) && e._start && days(e._end || e._start) >= 0],
  ["theater", "劇場スケジュール", e => e.house === st.house && (!e._start || days(e._end || e._start) >= 0)],
  ["follow", "★ フォロー中", e => followed(e)],  // フォローした人が出る劇場の定期公演もここに出す
  ["all", "すべて", e => !isDaily(e)],
];

function filtered(tabFn){
  return events.filter(e =>
    tabFn(e) &&
    (st.tab === "theater" || !st.genres.size || st.genres.has(e.genre)) &&
    (!st.free || e.free) &&
    (!st.region || e.region === st.region) &&
    (!st.pref || e.prefecture === st.pref) &&
    (!st.q || st.q.toLowerCase().split(/\s+/).every(w => e._hay.includes(w))));
}

function renderTabs(){
  $("#tabs").innerHTML = TABS.map(([id, label, fn]) =>
    `<button class="tab" role="tab" data-tab="${id}" aria-selected="${st.tab===id}">${label}<span class="n">${filtered(fn).length}</span></button>`).join("");
}
function renderHouses(){
  $("#houses").innerHTML = Object.entries(HOUSES).map(([k, v]) =>
    `<button class="chip" data-house="${k}" aria-pressed="${st.house===k}">${v}</button>`).join("");
}
function renderChips(){
  $("#genres").innerHTML = Object.entries(meta.genres).map(([k, v]) =>
    `<button class="chip" data-genre="${k}" aria-pressed="${st.genres.has(k)}">${pic(k)}${v}</button>`).join("")
    + `<button class="chip" id="freeOnly" aria-pressed="${st.free}">${pic("free")}無料ライブ</button>`
    + `<button class="chip" id="openFollow">${pic("follow")}フォロー設定</button>`;
  renderMap();
}

function renderMap(){
  // 地方・都道府県ごとの件数は、エリア以外の条件(タブ・ジャンル・無料・キーワード)で数える
  const tab = TABS.find(t => t[0] === st.tab);
  const keep = {region: st.region, pref: st.pref};
  st.region = ""; st.pref = "";
  const base = filtered(tab[2]);
  Object.assign(st, keep);
  const byRegion = {}, byPref = {};
  for (const e of base) {
    byRegion[e.region] = (byRegion[e.region] || 0) + 1;
    if (e.prefecture) byPref[e.prefecture] = (byPref[e.prefecture] || 0) + 1;
  }
  document.querySelectorAll(".rg").forEach(g => {
    const r = g.dataset.region;
    g.classList.toggle("on", st.region === r);
    g.classList.toggle("dim", !!st.region && st.region !== r);
    g.setAttribute("aria-pressed", st.region === r);
  });
  document.querySelectorAll("[data-count]").forEach(t => {
    const n = byRegion[t.dataset.count] || 0;
    t.textContent = n ? n + "件" : "";
  });
  $("#areaLabel").textContent = st.pref || st.region || "全国";
  const prefs = st.region ? Object.keys(PREF_REGION).filter(p => PREF_REGION[p] === st.region) : [];
  $("#prefchips").innerHTML = prefs.length
    ? `<button class="chip" data-pref="" aria-pressed="${!st.pref}">${st.region}すべて</button>` +
      prefs.map(p => `<button class="chip" data-pref="${p}" aria-pressed="${st.pref===p}">${p.replace(/[都府県]$/,"")}${byPref[p] ? `<span class="n">${byPref[p]}</span>` : ""}</button>`).join("")
    : `<p class="hint" style="margin:0">地図の地方をタップすると、都道府県で絞り込めます。${byRegion["オンライン"] ? `<button class="chip" data-region="オンライン" style="margin-left:6px">オンライン ${byRegion["オンライン"]}件</button>` : ""}</p>`;
}

function dateBox(e){
  const x = e._start;
  if (!x) return `<div class="date none"><div class="d">日程<br>未定</div></div>`;
  return `<div class="date"><div class="m">${x.getFullYear()!==TODAY.getFullYear()? x.getFullYear()+"/":""}${x.getMonth()+1}月</div>
    <div class="d">${x.getDate()}</div><div class="w">${W[x.getDay()]}${e._end ? "〜" + (e._end.getMonth()+1) + "/" + e._end.getDate() : ""}</div></div>`;
}
function perfLine(e){
  const ps = e.performers || [];
  if (!ps.length) return "";
  const show = ps.slice(0, 8).map(p =>
    `<button class="pf ${st.follows.has(p) ? "on" : ""}" data-follow="${esc(p)}" title="${esc(p)}をフォロー">${esc(p)}</button>`).join("、");
  return `<div class="perf">🎤 出演: ${show}${ps.length > 8 ? ` ほか${ps.length - 8}組` : ""}</div>`;
}
function card(e){
  const key = e.performers?.[0] || e.venue || "";
  const on = key && st.follows.has(key);
  return `<article class="card">
    ${dateBox(e)}
    <div>
      <div class="badges"><span class="badge g-${e.genre||"music"}">${esc(meta.genres[e.genre] || "その他")}</span>
        ${isNew(e) ? `<span class="badge k-new">NEW</span>` : ""}
        ${e.free ? `<span class="badge k-free">無料</span>` : ""}
        ${e.house && st.tab !== "theater" ? `<span class="badge k-house">${esc(HOUSES[e.house] || "")}</span>` : ""}
        ${e.special ? `<span class="badge k-special">特別公演</span>` : ""}</div>
      <a class="title" href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a>
      <div class="meta">
        ${e.venue || e.prefecture ? `<span>📍 ${esc(e.venue || "")}${e.prefecture ? `(${esc(e.prefecture)})` : ""}</span>` : (e.region !== "不明" ? `<span>📍 ${esc(e.region)}</span>` : "")}
      </div>
      ${perfLine(e)}
      <a class="tix" href="${esc(e.url)}" target="_blank" rel="noopener">🎫 チケット・先行は公式で確認 →</a>
      <div class="src">出典: ${esc((e.source_names || []).join(" / "))}</div>
    </div>
    ${key ? `<button class="star" data-follow="${esc(key)}" aria-pressed="${on}" title="${esc(key)} をフォロー">${on ? "★" : "☆"}</button>` : "<span></span>"}
  </article>`;
}

function render(){
  renderTabs();
  renderMap();
  const tab = TABS.find(t => t[0] === st.tab);
  let list = filtered(tab[2]);
  let groups = new Map();
  document.body.classList.toggle("theater", st.tab === "theater");
  renderHouses();
  if (st.tab === "new") {
    list.sort((a, b) => b._first - a._first);
    groups.set("前回の訪問以降に見つかった情報", list);
  } else if (st.tab === "theater") {
    // 日ごと。会期のある公演は初日に並べる。日付の無いお知らせは最後
    list.sort((a, b) => (a._start || 9e15) - (b._start || 9e15));
    for (const e of list) {
      const x = e._start;
      const k = !x ? "お知らせ・日程未定"
        : days(e._end || x) >= 0 && days(x) < 0 ? "上演中"
        : `${x.getMonth()+1}月${x.getDate()}日(${W[x.getDay()]})${days(x) === 0 ? "・今日" : days(x) === 1 ? "・明日" : ""}`;
      (groups.get(k) || groups.set(k, []).get(k)).push(e);
    }
    if (groups.has("上演中")) { const v = groups.get("上演中"); groups.delete("上演中"); groups = new Map([["上演中", v], ...groups]); }
  } else {
    list.sort((a, b) => (a._start || 9e15) - (b._start || 9e15));
    for (const e of list) { const k = e._start ? `${e._start.getFullYear()}年${e._start.getMonth()+1}月` : "日程未定・ニュース";
      (groups.get(k) || groups.set(k, []).get(k)).push(e); }
  }
  const emptyMsg = st.tab === "follow" && !st.follows.size
    ? "まだ何もフォローしていません。★を押すか「フォロー設定」から追加してください。"
    : st.tab === "new" ? "前回の訪問以降の新着はありません。"
    : st.tab === "theater" ? `${esc(HOUSES[st.house] || "")}の公演情報はまだありません(巡回の準備中です)。`
    : "条件に合う情報はありません。";
  $("#list").innerHTML = list.length ? [...groups].map(([k, es]) =>
    `<section class="group"><h2>${esc(k)}(${es.length})</h2>${es.map(card).join("")}</section>`).join("")
    : `<p class="empty">${emptyMsg}</p>`;
  $("#hint").textContent = st.tab === "new"
    ? `新着 = ${lastVisit ? "前回の訪問(" + since.toLocaleString("ja-JP", {month:"numeric", day:"numeric", hour:"numeric", minute:"2-digit"}) + ")" : "直近3日"}以降に見つかった情報`
    : "";
}

document.addEventListener("click", ev => {
  const t = ev.target.closest("button,.rg"); if (!t) return;
  if (t.dataset.tab) { st.tab = t.dataset.tab; }
  else if (t.dataset.genre) { st.genres.has(t.dataset.genre) ? st.genres.delete(t.dataset.genre) : st.genres.add(t.dataset.genre); renderChips(); wiggle(`[data-genre="${t.dataset.genre}"]`); }
  else if (t.dataset.region !== undefined) { st.region = (st.region === t.dataset.region ? "" : t.dataset.region); st.pref = ""; }
  else if (t.dataset.pref !== undefined) { st.pref = t.dataset.pref; }
  else if (t.dataset.house) { st.house = t.dataset.house; }
  else if (t.id === "allJapan") { st.region = ""; st.pref = ""; }
  else if (t.id === "mapToggle") { const c = $("#mapbox").classList.toggle("closed"); t.textContent = c ? "地図をひらく" : "地図をたたむ"; store.set("mapClosed", c); return; }
  else if (t.dataset.follow) { const k = t.dataset.follow; st.follows.has(k) ? st.follows.delete(k) : st.follows.add(k); store.set("follows", [...st.follows]); }
  else if (t.id === "freeOnly") { st.free = !st.free; renderChips(); wiggle("#freeOnly"); }
  else if (t.id === "openFollow") { wiggle("#openFollow"); renderFollow(); setTimeout(() => $("#followDlg").showModal(), 250); return; }
  else if (t.dataset.unfollow) { st.follows.delete(t.dataset.unfollow); store.set("follows", [...st.follows]); renderFollow(); }
  else if (t.id === "followAdd") { ev.preventDefault(); const v = $("#followInput").value.trim(); if (v) { st.follows.add(v); store.set("follows", [...st.follows]); $("#followInput").value = ""; renderFollow(); } }
  else return;
  render();
});
function renderFollow(){
  $("#followList").innerHTML = [...st.follows].map(f => `<button class="chip" data-unfollow="${esc(f)}" aria-pressed="true">${esc(f)} ✕</button>`).join("") || `<span style="color:var(--dim);font-size:13px">なし</span>`;
}
document.addEventListener("keydown", ev => {
  const g = ev.target.closest && ev.target.closest(".rg");
  if (g && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); g.dispatchEvent(new MouseEvent("click", {bubbles: true})); }
});
if (store.get("mapClosed", false)) { $("#mapbox").classList.add("closed"); $("#mapToggle").textContent = "地図をひらく"; }
$("#q").addEventListener("input", e => { st.q = e.target.value.trim(); render(); });
if (meta.sample) $("#sample").innerHTML = `<p class="sample">これは画面確認用のプロトタイプです。表示中の公演はすべて架空のサンプルデータで、実在の公演ではありません。</p>`;
$("#gen").textContent = `最終更新 ${meta.generated_at.replace("T", " ")}・${meta.count}件`;
renderChips(); render();
})();
</script>
</body>
</html>
