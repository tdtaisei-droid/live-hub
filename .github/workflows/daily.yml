# 毎日 自動で巡回 → サイト生成 → GitHub Pages に公開する
name: daily

on:
  schedule:
    - cron: "17 21 * * *"   # 毎日 06:17 JST(UTCで21:17)
    - cron: "47 21 * * 0"   # 毎週月曜 06:47 JST: 情報源サイトの再調査
  workflow_dispatch:         # 手動実行ボタン
    inputs:
      job:
        description: "daily=巡回とサイト生成 / verify=候補URLの確認だけ"
        type: choice
        options: [daily, verify]
        default: daily
      only:
        description: "巡回する情報源ID(カンマ区切り・空なら通常どおり)"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    if: github.event.schedule == '17 21 * * *' || (github.event_name == 'workflow_dispatch' && inputs.job != 'verify')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 情報源リストの確認
        run: python -m livehub check
      - name: 巡回とサイト生成
        env:
          LIVEHUB_UA: ${{ vars.LIVEHUB_UA }}
          ONLY: ${{ inputs.only }}
        run: python -m livehub daily ${ONLY:+--only "$ONLY"}
      - name: 蓄積データを保存(次回の差分・新着判定に使う)
        run: |
          git config user.name "livehub-bot"
          git config user.email "livehub-bot@users.noreply.github.com"
          for f in data/livehub.sqlite3 data/http_cache.json data/organizer_candidates.csv data/url_check.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet || git commit -m "data: daily update $(date +%F)"
          git pull --rebase origin main && git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4

  discover:
    # 毎週月曜に情報源サイトの構造(RSS/構造化データ/robots.txt)を再調査
    if: always() && (github.event.schedule == '47 21 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.job == 'verify'))
    needs: run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 候補URLの確認(ページの名乗りに名前があるか)
        run: python -m livehub verify
      - name: 情報源サイトの調査
        if: inputs.job != 'verify'
        run: python -m livehub discover
      - name: 調査結果をリポジトリに保存
        run: |
          git config user.name "livehub-bot"
          git config user.email "livehub-bot@users.noreply.github.com"
          # 他の実行と同時に保存しても結果を失わないよう、最新を取り込んでから確認日時の新しい方を残してまとめる
          cp data/url_check.json /tmp/url_check.mine.json
          [ -f data/source_status.json ] && cp data/source_status.json /tmp/source_status.mine.json || true
          git fetch origin main && git reset --hard origin/main
          python -m livehub merge-checks /tmp/url_check.mine.json
          [ -f /tmp/source_status.mine.json ] && cp /tmp/source_status.mine.json data/source_status.json || true
          git add -f data/url_check.json
          [ -f data/source_status.json ] && git add -f data/source_status.json
          git diff --cached --quiet || git commit -m "data: source status $(date +%F)"
          git push || (sleep 20; git fetch origin main && git rebase -X theirs origin/main && git push)
